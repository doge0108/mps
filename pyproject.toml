[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mps"
version = "0.1.0"
description = "MLB Prediction System: per-game player stat and game outcome prediction with gradient boosting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mps = "mps.cli:main"

[tool.setuptools.packages.find]
include = ["mps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
